<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 디지털 생애곡선 | 디지털새싹 수업 체험</title>
<link rel="icon" href="../assets/img/kaaie-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="../assets/activity.css">
</head>
<body>
<header class="a-head">
  <div class="a-in">
    <a class="a-brand" href="../index.html" aria-label="디지털새싹 홈"><img src="../assets/img/kaaie-logo.png" alt="한국인공지능교육학회" width="284" height="53"><span class="sep" aria-hidden="true"></span><span class="name">디지털새싹</span></a>
    <nav class="a-nav" aria-label="이동"><a href="../2026.html#make">Make! 클래스 마켓</a><a href="../try.html">수업 자료 목록</a></nav>
  </div>
</header>
<section class="a-hero">
  <div class="a-in">
    <p class="a-kicker"><span class="v">Make!</span><span>클래스 마켓 · 초등 5~6학년</span><span class="ses">7~8차시 · 성장기</span></p>
    <h1>나의 디지털 생애곡선</h1>
    <p class="sub">어릴 때부터 노년까지 나의 자산이 어떻게 달라질지 마우스나 손가락으로 곡선을 그리고, 자산관리 약속을 세워요.</p>
  </div>
</section>
<div class="wrap">
<section class="card"><h2><span class="step">1</span>나의 디지털 생애곡선</h2><canvas id="curve"></canvas><div class="row" style="margin-top:12px"><button class="secondary" id="clear">곡선 지우기</button></div></section>
<section class="card"><h2><span class="step">2</span>생각 정리</h2><div class="fieldline"><label>자산이 가장 늘어날 때</label><input class="writing" data-example="예: 계획적으로 저축을 시작할 때"></div><div class="fieldline"><label>그렇게 생각한 이유</label><input class="writing" data-example="예: 목표를 세우고 꾸준히 모을 수 있어서"></div><div class="fieldline"><label>자산이 줄어들 수 있는 때</label><input class="writing" data-example="예: 충동구매를 많이 할 때"></div><div class="fieldline"><label>자산관리 약속 1</label><input class="writing" data-example="예: 사고 싶은 물건을 하루 생각해 보기"></div><div class="fieldline"><label>자산관리 약속 2</label><input class="writing" data-example="예: 용돈의 일부는 저축하기"></div><div class="fieldline"><label>자산관리 약속 3</label><input class="writing" data-example="예: 지출 내용을 기록하기"></div></section>
</div>
<script>
function escHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showExport(canvas,label){
  const out=document.getElementById('exportOut'); if(!out) return;
  out.innerHTML='';
  const img=new Image(); img.alt=label+' 완성 이미지'; img.src=canvas.toDataURL('image/png');
  const cap=document.createElement('p'); cap.className='small muted';
  cap.textContent='완성된 이미지입니다. 이미지를 길게 누르거나 마우스 오른쪽 버튼을 눌러 저장하세요.';
  out.append(img,cap); out.hidden=false;
  out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function initExampleFields(){
  document.querySelectorAll('[data-example]').forEach(el=>{
    if(!el.value){
      el.value = el.dataset.example;
      el.dataset.exampleActive = '1';
      el.classList.add('example');
    }
    el.addEventListener('focus', ()=>{
      if(el.dataset.exampleActive === '1'){
        el.value = '';
        el.dataset.exampleActive = '0';
        el.classList.remove('example');
      }
    }, {once:true});
  });
}
function realValue(el){
  if(!el) return '';
  return el.dataset.exampleActive === '1' ? '' : (el.value||'').trim();
}
function byId(id){ return document.getElementById(id); }
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const lines = String(text||'').split(/\n/);
  for(const src of lines){
    const words = src.split(/\s+/);
    let line = '';
    for(const w of words){
      const test = line ? line + ' ' + w : w;
      if(ctx.measureText(test).width > maxWidth && line){ ctx.fillText(line,x,y); line = w; y += lineHeight; }
      else line = test;
    }
    if(line) ctx.fillText(line,x,y);
    y += lineHeight;
  }
  return y;
}
function downloadCanvas(canvas, filename){ const a=document.createElement('a'); a.download=filename; a.href=canvas.toDataURL('image/png'); a.click(); }

initExampleFields();
const canvas=byId('curve'),ctx=canvas.getContext('2d'); let drawing=false,points=[];
function fit(){ const r=canvas.getBoundingClientRect(); canvas.width=Math.floor(r.width*devicePixelRatio); canvas.height=Math.floor(360*devicePixelRatio); canvas.style.height='360px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); draw(); }
function base(){ const w=canvas.clientWidth,h=360; ctx.clearRect(0,0,w,h); ctx.strokeStyle='#d1d5db'; ctx.lineWidth=1; ctx.font='13px sans-serif'; ctx.fillStyle='#64748b'; for(let i=0;i<=4;i++){ const y=30+i*(h-70)/4; ctx.beginPath(); ctx.moveTo(50,y); ctx.lineTo(w-20,y); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(50,30); ctx.lineTo(50,h-40); ctx.lineTo(w-20,h-40); ctx.strokeStyle='#111827'; ctx.lineWidth=2; ctx.stroke(); ctx.fillText('자산 많음',8,38); ctx.fillText('자산 적음',8,h-44); ctx.fillText('어릴 때',52,h-15); ctx.fillText('청소년',w*.34,h-15); ctx.fillText('어른',w*.62,h-15); ctx.fillText('노년',w-58,h-15); }
function draw(){ base(); if(points.length<2) return; ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y); for(const p of points.slice(1)) ctx.lineTo(p.x,p.y); ctx.strokeStyle='#2563eb'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); }
function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
canvas.addEventListener('mousedown',e=>{ drawing=true; points.push(pos(e)); draw(); }); canvas.addEventListener('mousemove',e=>{ if(!drawing) return; points.push(pos(e)); draw(); }); window.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); drawing=true; points.push(pos(e)); draw(); },{passive:false}); canvas.addEventListener('touchmove',e=>{ e.preventDefault(); if(!drawing) return; points.push(pos(e)); draw(); },{passive:false}); window.addEventListener('touchend',()=>drawing=false);
byId('clear').addEventListener('click',()=>{ points=[]; draw(); }); window.addEventListener('resize',fit); fit();
</script>
</body>
</html>
